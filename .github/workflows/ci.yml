name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited runs the check again when a pull request is retitled, so the
    # condition on build below always reads the current title.
    types: [opened, synchronize, reopened, edited]

jobs:
  build:
    # A pull request titled docs skips the build. The condition sits on the
    # job, not on the triggers: a skipped job reports success to a required
    # check, while a workflow skipped by a filter leaves it pending.
    if: >-
      github.event_name != 'pull_request'
      || !startsWith(github.event.pull_request.title, 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # docker-coq-action picks the rocq/rocq-prover image for Rocq >= 9.0.
      # Its default install step pins the checkout as an opam path and
      # installs the dependencies of opam/rocq-jwa.opam, which upgrades dune
      # inside the image if the one shipped is older than dune-project asks.
      - name: Rocq 9.2
        uses: coq-community/docker-coq-action@v1
        with:
          coq_version: '9.2'
          opam_file: '.'
          # The container user (uid 1000) does not own the checkout
          # (uid 1001). git then refuses to run in it, which breaks the
          # install step's opam pin, so the chown has to happen before
          # install, not in before_script. The opam list is the action's
          # default for this step, kept because it shows what the image ships.
          # dune-project asks for no newer dune than the image pins: opam
          # would otherwise recompile Rocq itself along with the upgrade.
          before_install: |
            sudo chown -R "$(id -u):$(id -g)" .
            startGroup "Print opam config"
              opam config list; opam repo list; opam list
            endGroup
          # Replaces the default script, which would opam-install the
          # package; the three checks below are what a PR must keep green.
          # The opam file is built by its target path rather than the @opam
          # alias, which the image's dune does not have; under (lang dune
          # 3.21) that rewrites the checked-in file in place instead of
          # reporting a diff, so git is what catches a stale one.
          script: |
            startGroup "Build"
              make build
            endGroup
            startGroup "opam file in sync with dune-project"
              make opam
              git diff --exit-code opam/
            endGroup
            startGroup "dune files formatted"
              make fmt-check
            endGroup
          # The default uninstall test would opam remove the package, which
          # the script above never installed.
          uninstall: ''

      # The build again under the newest Rocq that dune-project admits; the
      # opam and format checks do not depend on the Rocq version. A second
      # step and not a matrix, since a matrix would report build (9.2) and
      # build (9.3), and the check that main requires is named build.
      - name: Rocq 9.3
        uses: coq-community/docker-coq-action@v1
        with:
          coq_version: '9.3'
          opam_file: '.'
          before_install: |
            sudo chown -R "$(id -u):$(id -g)" .
            startGroup "Print opam config"
              opam config list; opam repo list; opam list
            endGroup
          script: |
            startGroup "Build"
              make build
            endGroup
          uninstall: ''

      # The chown above leaves the checkout owned by the container user, and
      # the checkout action's cleanup then cannot write .git/config. Runs on
      # the runner, so id resolves to the runner user.
      - name: Revert permissions
        if: ${{ always() }}
        run: sudo chown -R "$(id -u):$(id -g)" .
