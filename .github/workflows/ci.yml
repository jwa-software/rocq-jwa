name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker-coq-action picks the rocq/rocq-prover image for Rocq >= 9.0.
      # Its default install step pins the checkout as an opam path and
      # installs the dependencies of opam/rocq-jwa.opam, which upgrades dune
      # inside the image if the one shipped is older than dune-project asks.
      - uses: coq-community/docker-coq-action@v1
        with:
          coq_version: '9.2'
          opam_file: '.'
          # The container user (uid 1000) does not own the checkout
          # (uid 1001). git then refuses to run in it, which breaks the
          # install step's opam pin, so the chown has to happen before
          # install, not in before_script. The image pins dune to an older
          # version and opam never upgrades a pinned package, so the pin is
          # removed here and the install step's --deps-only then picks a dune
          # satisfying dune-project. The opam list is the action's default for
          # this step, kept because it shows what the image ships.
          before_install: |
            sudo chown -R "$(id -u):$(id -g)" .
            opam pin remove -n -y dune
            startGroup "Print opam config"
              opam config list; opam repo list; opam list
            endGroup
          # Replaces the default script, which would opam-install the
          # package; the three checks below are what a PR must keep green.
          script: |
            startGroup "Build"
              opam exec -- dune build
            endGroup
            startGroup "opam file in sync with dune-project"
              opam exec -- dune build @opam
            endGroup
            startGroup "dune files formatted"
              opam exec -- dune build @fmt
            endGroup
